<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E-Commerce Store</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <header class="site-header">

        <div class="container">

            <h1>
                E-Commerce Store
            </h1>

            <p>
                Browse our latest products
            </p>

        </div>

    </header>


    <main class="container">

        <section class="catalog-header">

            <h2>
                Products
            </h2>

        </section>


        <section class="filters">

            <input
                type="text"
                id="search-input"
                placeholder="Search products..."
            >


            <select id="category-filter">

                <option value="">
                    All Categories
                </option>

            </select>


            <select id="brand-filter">

                <option value="">
                    All Brands
                </option>

            </select>


            <input
                type="number"
                id="min-price"
                placeholder="Min Price"
                min="1"
            >


            <input
                type="number"
                id="max-price"
                placeholder="Max Price"
                min="1"
            >


            <select id="sort-filter">

                <option value="newest">
                    Newest
                </option>

                <option value="price_asc">
                    Price: Low to High
                </option>

                <option value="price_desc">
                    Price: High to Low
                </option>

                <option value="name_asc">
                    Name: A-Z
                </option>

                <option value="name_desc">
                    Name: Z-A
                </option>

            </select>


            <button
                id="apply-filters"
                type="button"
            >
                Apply
            </button>


            <button
                id="reset-filters"
                type="button"
                class="secondary-button"
            >
                Reset
            </button>

        </section>


        <p
            id="loading-message"
            class="status-message"
        >
            Loading products...
        </p>


        <p
            id="error-message"
            class="error-message"
        ></p>


        <section
            id="products-container"
            class="products-grid"
        >
        </section>


        <section
            id="pagination"
            class="pagination"
        >

            <button
                id="previous-page"
                type="button"
            >
                Previous
            </button>


            <span id="page-info">
                Page 1
            </span>


            <button
                id="next-page"
                type="button"
            >
                Next
            </button>

        </section>

    </main>



    <!-- AI CHAT WIDGET -->

    <div class="ai-chat-widget">

        <button
            id="chat-toggle-button"
            class="chat-toggle-button"
            type="button"
            aria-label="Open AI chat"
        >
            💬
        </button>


        <section
            id="chat-window"
            class="chat-window"
        >

            <header class="chat-header">

                <div>

                    <strong>
                        AI Shopping Assistant
                    </strong>

                    <span>
                        Ask about products, prices and stock
                    </span>

                </div>


                <button
                    id="chat-close-button"
                    type="button"
                    class="chat-close-button"
                >
                    ×
                </button>

            </header>


            <div
                id="chat-messages"
                class="chat-messages"
            >

                <div
                    class="chat-message assistant-message"
                >
                    Hi! How can I help you find a product today?
                </div>

            </div>


            <form
                id="chat-form"
                class="chat-form"
            >

                <input
                    id="chat-input"
                    type="text"
                    maxlength="1000"
                    placeholder="Ask about products..."
                    autocomplete="off"
                    required
                >


                <button
                    id="chat-send-button"
                    type="submit"
                >
                    Send
                </button>

            </form>

        </section>

    </div>



    <!-- JAVASCRIPT -->
<script src="js/api.js?v=9"></script>
<script src="js/products.js"></script>
<script src="js/chat-widget.js?v=5"></script>

</body>

</html>
