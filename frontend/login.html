<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1>E-Commerce Store</h1>
            <p>Customer Login</p>
        </div>
    </header>


    <main class="container">

        <section class="login-card">

            <h2>Login</h2>

            <form id="login-form">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    minlength="8"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p
                id="login-error"
                class="error-message"
            ></p>

        </section>

    </main>


    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
