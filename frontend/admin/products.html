<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Products</title>

    <link
        rel="stylesheet"
        href="css/admin.css"
    >
</head>

<body>

    <aside class="admin-sidebar">

        <div class="admin-logo">
            Admin Panel
        </div>

        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="categories.html">
                Categories
            </a>

            <a href="brands.html">
                Brands
            </a>

            <a
                href="products.html"
                class="active"
            >
                Products
            </a>

            <a href="inventory.html">
                Inventory
            </a>

            <a href="orders.html">
                Orders
            </a>

        </nav>

    </aside>


    <div class="admin-main">

        <header class="admin-header">

            <h1>Products</h1>

            <button id="logout-button">
                Logout
            </button>

        </header>


        <main class="admin-content">

            <section class="admin-form-card">

                <h2 id="form-title">
                    Add Product
                </h2>


                <form
                    id="product-form"
                    class="product-admin-form"
                >

                    <div>
                        <label for="product-name">
                            Name
                        </label>

                        <input
                            id="product-name"
                            type="text"
                            required
                        >
                    </div>


                    <div>
                        <label for="product-slug">
                            Slug
                        </label>

                        <input
                            id="product-slug"
                            type="text"
                            required
                        >
                    </div>


                    <div>
                        <label for="product-sku">
                            SKU
                        </label>

                        <input
                            id="product-sku"
                            type="text"
                            required
                        >
                    </div>


                    <div>
                        <label for="category-id">
                            Category
                        </label>

                        <select
                            id="category-id"
                            required
                        >
                        </select>
                    </div>


                    <div>
                        <label for="brand-id">
                            Brand
                        </label>

                        <select
                            id="brand-id"
                            required
                        >
                        </select>
                    </div>


                    <div>
                        <label for="product-price">
                            Price
                        </label>

                        <input
                            id="product-price"
                            type="number"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>


                    <div>
                        <label for="sale-price">
                            Sale Price
                        </label>

                        <input
                            id="sale-price"
                            type="number"
                            min="0.01"
                            step="0.01"
                        >
                    </div>


                    <div>
                        <label for="image-url">
                            Image URL
                        </label>

                        <input
                            id="image-url"
                            type="url"
                        >
                    </div>


                    <div class="product-description-field">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            rows="4"
                        ></textarea>

                    </div>


                    <div class="form-actions">

                        <button
                            type="submit"
                            id="save-button"
                        >
                            Create Product
                        </button>

                        <button
                            type="button"
                            id="cancel-edit"
                            class="secondary-admin-button"
                        >
                            Cancel Edit
                        </button>

                    </div>

                </form>


                <p
                    id="form-message"
                    class="admin-message"
                ></p>

            </section>


            <section class="admin-table-card">

                <h2>All Products</h2>


                <div class="admin-product-filters">

                    <input
                        id="search-filter"
                        type="text"
                        placeholder="Search name or SKU"
                    >


                    <select id="category-filter">

                        <option value="">
                            All Categories
                        </option>

                    </select>


                    <select id="brand-filter">

                        <option value="">
                            All Brands
                        </option>

                    </select>


                    <select id="status-filter">

                        <option value="">
                            All Status
                        </option>

                        <option value="true">
                            Active
                        </option>

                        <option value="false">
                            Inactive
                        </option>

                    </select>


                    <button
                        id="apply-filter"
                        type="button"
                    >
                        Apply
                    </button>

                </div>


                <p id="loading">
                    Loading products...
                </p>


                <p
                    id="page-error"
                    class="admin-error"
                ></p>


                <div class="table-wrapper">

                    <table class="admin-table">

                        <thead>

                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>SKU</th>
                                <th>Category</th>
                                <th>Brand</th>
                                <th>Price</th>
                                <th>Sale</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody
                            id="products-table"
                        >
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="../js/api.js?v=3"></script>
    <script src="js/admin-auth.js"></script>
    <script src="js/products.js"></script>

</body>

</html>
