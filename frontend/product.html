<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1>E-Commerce Store</h1>

            <p>
                Product Details
            </p>
        </div>
    </header>


    <main class="container">

        <div class="back-link-wrapper">
            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Products
            </a>
        </div>


        <p
            id="loading-message"
            class="status-message"
        >
            Loading product...
        </p>


        <p
            id="error-message"
            class="error-message"
        ></p>


        <section
            id="product-detail"
            class="product-detail"
        >
        </section>


        <section
            id="variants-section"
            class="variants-section"
        >
            <h2>Available Variants</h2>

            <div
                id="variants-container"
                class="variants-grid"
            >
            </div>
        </section>

    </main>


    <script src="js/api.js"></script>
    <script src="js/product-detail.js"></script>

</body>

</html>
